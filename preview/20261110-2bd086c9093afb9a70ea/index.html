const status=document.getElementById('status'),message=document.getElementById('message'),viewer=document.getElementById('viewer');
function fromBase64(value){
  return Uint8Array.from(atob(value.replace(/-/g,'+').replace(/_/g,'/')),char=>char.charCodeAt(0));
}
async function openViewer(){
  const secret=location.hash.slice(1);
  if(!/^[a-zA-Z0-9_-]{43}$/.test(secret)){
    message.textContent='Откройте полную ссылку из письма, чтобы посмотреть модель.';
    return;
  }
  try{
    const key=await crypto.subtle.importKey('raw',fromBase64(secret),'AES-GCM',false,['decrypt']);
    const content=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(lock.iv)},key,fromBase64(lock.encrypted));
    viewer.srcdoc=new TextDecoder('utf-8',{fatal:true}).decode(content);
    status.hidden=true;viewer.hidden=false;
  }catch{
    message.textContent='Ссылка не открылась. Проверьте, что она скопирована целиком.';
  }
}
openViewer();
addEventListener('hashchange',()=>location.reload());
